<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Conversation Story — Design Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tenor+Sans&family=Sen:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  /* ============================================================
     Palette (from notes/fonts-and-colors.txt)
     ============================================================ */
  :root {
    --red:    #A6142F;   /* graceful-red    */
    --navy:   #0D1940;   /* graceful-navy   */
    --blue:   #3772A6;   /* graceful-blue   */
    --yellow: #F2CE1B;   /* graceful-yellow */
    --orange: #F28444;   /* graceful-orange */

    /* Derived neutrals — warm "paper" deco feel */
    --paper:      #F7F3EA;
    --paper-2:    #FBF8F1;
    --ink:        var(--navy);
    --ink-soft:   #47506E;
    --ink-faint:  #8A90A6;
    --line:       #E3DCCB;
    --line-strong:#C9BF9F;
    --gold:       #C9A227;

    --card-radius: 3px;
    --sidebar-w: 420px;

    --font-head: "Tenor Sans", "Sen", system-ui, sans-serif;
    --font-body: "Sen", system-ui, sans-serif;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: var(--font-body);
    color: var(--ink);
    background: var(--paper);
    background-image:
      radial-gradient(circle at 50% -10%, rgba(55,114,166,0.06), transparent 60%);
    font-size: 15px;
    line-height: 1.5;
  }

  /* ============================================================
     Header
     ============================================================ */
  header.site {
    display: flex; align-items: center; gap: 20px;
    padding: 14px 26px;
    background: var(--navy);
    color: var(--paper);
    border-bottom: 3px solid var(--gold);
    box-shadow: 0 2px 0 rgba(13,25,64,0.25), 0 6px 18px rgba(13,25,64,0.18);
  }
  header.site .logo {
    width: 52px; height: 52px; flex: 0 0 auto;
    /* logo is black line-art; invert to sit on navy */
    filter: invert(1) brightness(1.6);
  }
  header.site .titles { display: flex; flex-direction: column; gap: 2px; }
  header.site h1 {
    font-family: var(--font-head);
    font-weight: 400; font-size: 22px; margin: 0;
    letter-spacing: 0.14em; text-transform: uppercase;
  }
  header.site .subtitle {
    font-size: 12.5px; letter-spacing: 0.18em; text-transform: uppercase;
    color: var(--yellow);
  }
  header.site .meta {
    margin-left: auto; display: flex; gap: 26px;
    text-align: right;
  }
  header.site .meta .stat { display: flex; flex-direction: column; }
  header.site .meta .stat .k {
    font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase;
    color: var(--ink-faint);
  }
  header.site .meta .stat .v {
    font-family: var(--font-head); font-size: 16px; letter-spacing: 0.05em;
  }

  /* ============================================================
     Layout: main column + sidebar
     ============================================================ */
  .shell { display: flex; align-items: flex-start; }

  main.timeline {
    flex: 1 1 auto; min-width: 0;
    padding: 30px clamp(20px, 4vw, 60px) 120px;
    max-width: 980px; margin: 0 auto;
    transition: margin-right .18s ease;
  }
  .timeline .rail-label {
    font-family: var(--font-head);
    text-transform: uppercase; letter-spacing: 0.22em;
    font-size: 12px; color: var(--ink-faint);
    margin: 0 0 18px 2px;
    display: flex; align-items: center; gap: 12px;
  }
  .timeline .rail-label::after {
    content: ""; flex: 1 1 auto; height: 1px;
    background: linear-gradient(to right, var(--line-strong), transparent);
  }

  /* ============================================================
     Event cards
     ============================================================ */
  .card {
    position: relative;
    display: grid;
    grid-template-columns: 118px 1fr auto;
    gap: 16px; align-items: baseline;
    background: var(--paper-2);
    border: 1px solid var(--line);
    border-left: 4px solid var(--kind, var(--ink-faint));
    border-radius: var(--card-radius);
    padding: 13px 18px 13px 16px;
    margin: 0 0 10px;
    cursor: pointer;
    transition: transform .12s ease, box-shadow .12s ease, border-color .12s ease;
  }
  .card:hover {
    transform: translateX(2px);
    box-shadow: -2px 3px 0 rgba(13,25,64,0.06), 0 3px 14px rgba(13,25,64,0.08);
  }
  .card.active {
    border-color: var(--kind, var(--gold));
    box-shadow: -3px 4px 0 var(--kind, var(--gold));
  }

  .card .gutter {
    font-size: 11px; letter-spacing: 0.06em; color: var(--ink-faint);
    white-space: nowrap; padding-top: 2px;
  }
  .card .gutter .kind {
    display: inline-block;
    font-family: var(--font-head);
    text-transform: uppercase; letter-spacing: 0.12em;
    font-size: 10.5px; color: var(--kind, var(--ink-soft));
    margin-bottom: 3px;
  }
  .card .gutter .who { display: block; color: var(--ink-soft); font-weight: 500; }

  .card .body { min-width: 0; }
  .card .body .summary {
    color: var(--ink);
    overflow: hidden; text-overflow: ellipsis;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
  }
  .card .body .summary code {
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 0.86em; background: #EFE9DA; padding: 1px 5px; border-radius: 3px;
    color: var(--red);
  }
  .card .body .badges { margin-top: 7px; display: flex; gap: 6px; flex-wrap: wrap; }
  .badge {
    font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase;
    padding: 2px 7px; border-radius: 2px;
    border: 1px solid var(--line-strong); color: var(--ink-soft);
    background: #fff;
  }
  .badge.tok { border-color: var(--blue); color: var(--blue); }
  .badge.err { border-color: var(--red); color: var(--red); background: #FBEBEE; }
  .badge.model { border-color: var(--line-strong); color: var(--ink-faint); }
  .badge.agent { border-color: var(--red); color: var(--red); }

  .card .aside { text-align: right; white-space: nowrap; display: flex; flex-direction: column; align-items: flex-end; gap: 1px; }
  .card .aside .time {
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 12.5px; color: var(--ink-soft); font-variant-numeric: tabular-nums;
  }
  .card .aside .tz { font-size: 9px; letter-spacing: 0.14em; color: var(--ink-faint); }

  /* per-kind accent colors */
  .card.k-user       { --kind: var(--blue); }
  .card.k-assistant  { --kind: var(--navy); }
  .card.k-thinking   { --kind: var(--orange); }
  .card.k-tool_call  { --kind: var(--gold); }
  .card.k-tool_result{ --kind: #7A8B3D; }
  .card.k-subagent   { --kind: var(--red); }
  .card.k-system     { --kind: var(--ink-faint); }

  /* ============================================================
     Sidebar (detail) — collapsible + drag-resizable
     ============================================================ */
  aside.detail {
    position: sticky; top: 0; align-self: flex-start;
    height: 100vh;
    width: var(--sidebar-w);
    flex: 0 0 var(--sidebar-w);
    background: var(--paper-2);
    border-left: 1px solid var(--line-strong);
    box-shadow: -8px 0 24px rgba(13,25,64,0.06);
    display: flex; flex-direction: column;
    overflow: hidden;
  }
  body.sidebar-collapsed aside.detail { display: none; }

  aside.detail .resizer {
    position: absolute; left: -3px; top: 0; bottom: 0; width: 7px;
    cursor: col-resize; z-index: 5;
  }
  aside.detail .resizer:hover, body.resizing aside.detail .resizer {
    background: linear-gradient(to right, transparent, rgba(201,162,39,0.5));
  }

  aside.detail .d-head {
    display: flex; align-items: center; gap: 10px;
    padding: 14px 16px;
    border-bottom: 2px solid var(--kind, var(--gold));
    background: #fff;
  }
  aside.detail .d-head .kind {
    font-family: var(--font-head); text-transform: uppercase;
    letter-spacing: 0.14em; font-size: 13px; color: var(--kind, var(--ink));
  }
  aside.detail .d-head .d-time {
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 12px; color: var(--ink-faint);
  }
  aside.detail .d-head .close:first-of-type { margin-left: auto; }
  aside.detail .d-head .close { border: 1px solid var(--line-strong); background: #fff;
    color: var(--ink-soft); width: 26px; height: 26px; border-radius: 2px;
    cursor: pointer; font-size: 15px; line-height: 1;
  }
  aside.detail .d-head .close:hover { background: var(--paper); color: var(--red); }

  aside.detail .d-body { overflow-y: auto; padding: 16px; }

  .d-section { margin: 0 0 20px; }
  .d-section > h4 {
    font-family: var(--font-head); font-weight: 400;
    text-transform: uppercase; letter-spacing: 0.16em; font-size: 11px;
    color: var(--ink-faint); margin: 0 0 8px;
    padding-bottom: 5px; border-bottom: 1px solid var(--line);
  }
  .d-text {
    white-space: pre-wrap; font-size: 14px; line-height: 1.6;
    background: #fff; border: 1px solid var(--line);
    border-radius: 3px; padding: 12px 14px;
  }
  .kv { display: grid; grid-template-columns: 130px 1fr; gap: 4px 14px; font-size: 13px; }
  .kv dt { color: var(--ink-faint); }
  .kv dd { margin: 0; color: var(--ink); font-variant-numeric: tabular-nums; }
  .kv dd code, .mono {
    font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 12px;
  }
  pre.code {
    margin: 0; background: var(--navy); color: #E9ECF5;
    border-radius: 3px; padding: 12px 14px; overflow-x: auto;
    font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 12px;
    line-height: 1.55;
  }
  .token-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
  .token-grid .cell {
    background: #fff; border: 1px solid var(--line); border-radius: 3px;
    padding: 8px 10px;
  }
  .token-grid .cell .k {
    font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-faint);
  }
  .token-grid .cell .v { font-family: var(--font-head); font-size: 18px; }

  .empty-detail {
    margin: auto; text-align: center; color: var(--ink-faint);
    padding: 40px 30px;
  }
  .empty-detail .mark { font-size: 40px; opacity: .4; }

  /* Floating re-open tab when collapsed */
  .reopen {
    position: fixed; right: 0; top: 50%; transform: translateY(-50%);
    display: none; z-index: 25;
    writing-mode: vertical-rl;
    background: var(--navy); color: var(--paper);
    padding: 14px 8px; border: none; border-radius: 3px 0 0 3px;
    font-family: var(--font-head); letter-spacing: 0.16em; text-transform: uppercase;
    font-size: 11px; cursor: pointer;
  }
  body.sidebar-collapsed .reopen { display: block; }
</style>
</head>
<body>

<header class="site">
  <img class="logo" src="images/logo.png" alt="Graceful Developer logo">
  <div class="titles">
    <h1>Conversation Story</h1>
    <span class="subtitle">episode&nbsp;8 · before</span>
  </div>
  <div class="meta">
    <div class="stat"><span class="k">Events</span><span class="v">224</span></div>
    <div class="stat"><span class="k">Duration</span><span class="v">8m&nbsp;41s</span></div>
    <div class="stat"><span class="k">Model</span><span class="v">Opus&nbsp;4.6</span></div>
    <div class="stat"><span class="k">Branch</span><span class="v">main</span></div>
  </div>
</header>

<div class="shell">
  <main class="timeline">
    <p class="rail-label">Timeline</p>
    <div id="cards"><!-- cards injected by JS --></div>
  </main>

  <aside class="detail" id="sidebar">
    <div class="resizer" id="resizer"></div>
    <div class="d-head">
      <span class="kind" id="d-kind">Detail</span>
      <span class="d-time" id="d-time"></span>
      <button class="close" id="d-clear" title="Clear selection">◇</button>
      <button class="close" id="d-close" title="Collapse sidebar">×</button>
    </div>
    <div class="d-body" id="d-body">
      <div class="empty-detail">
        <div class="mark">❖</div>
        <p>Select an event to see its details.</p>
      </div>
    </div>
  </aside>
</div>

<button class="reopen" id="reopen">Details</button>

<script>
/* ------------------------------------------------------------------
   Sample events — one per kind, shaped like the intermediate schema
   (see notes/plan.md). Detail rendering is deliberately generic here;
   per-kind detail views come later.
------------------------------------------------------------------ */
const EVENTS = [
  {
    kind: "user", who: "Jess", time: "02:27:16",
    summary: "Let's design the intermediate schema on paper first, before writing any Ruby.",
    badges: [],
    detail: { section: "Message", text:
      "Let's design the intermediate schema on paper first, before writing any Ruby.\n\nI want to get the shape right so the renderer only ever reads the schema, never the original log." }
  },
  {
    kind: "thinking", who: "assistant", time: "02:27:18",
    summary: "The user wants a paper-first schema. I should enumerate the observed event types and fold in the required fields…",
    badges: [{t:"model", c:"model"}],
    detail: { section: "Reasoning", text:
      "The user wants a paper-first schema. Let me enumerate the observed top-level types (user, assistant, system, attachment…) and make sure every required field is folded in: tokens, provenance, queued status, linking data, per-event agent identity, wall-clock time." }
  },
  {
    kind: "assistant", who: "Claude", time: "02:27:24", model: "opus-4-6",
    summary: "Here's a proposed schema: one ordered list of events, each with a tiny summary and a detail payload. Unknown records fall back to a generic event so nothing is dropped.",
    badges: [{t:"opus-4-6", c:"model"}, {t:"↑ 3 · ↓ 322", c:"tok"}],
    detail: { section: "Message", text:
      "Here's a proposed schema: one ordered list of events, each with a tiny `summary` (default view) and a `detail` payload (drill-in). Everything in the log is representable; unknown records fall back to a generic event so nothing is dropped.",
      tokens: {input:3, output:322, cache_creation:10619, cache_read:13834},
      stop_reason: "end_turn" }
  },
  {
    kind: "tool_call", who: "Claude", time: "02:28:02",
    summary: "<b>Read</b> <code>notes/plan.md</code>",
    badges: [{t:"Read", c:""}],
    detail: { section: "Tool call — Read", kv: {
      "Tool": "Read", "use_id": "toolu_01X8…f3", "file_path": "notes/plan.md" },
      code: '{\n  "file_path": "notes/plan.md"\n}' }
  },
  {
    kind: "tool_result", who: "system", time: "02:28:02",
    summary: "Read 296 lines from <code>notes/plan.md</code> (12.4 KB).",
    badges: [{t:"307 ms", c:""}],
    detail: { section: "Tool result", kv: {
      "For": "toolu_01X8…f3", "Duration": "307 ms", "Error": "false", "Lines": "296" },
      text: "  1  # Conversation Story — Getting Started Plan\n  2\n  3  ## Context\n  4  …" }
  },
  {
    kind: "tool_call", who: "Claude", time: "02:29:11",
    summary: "<b>Bash</b> <code>ruby -v && bundle exec rake test</code>",
    badges: [{t:"Bash", c:""}, {t:"error", c:"err"}],
    detail: { section: "Tool call — Bash", kv: {
      "Tool": "Bash", "use_id": "toolu_02Kd…9a", "Error": "true", "Exit": "1" },
      code: 'ruby -v && bundle exec rake test' }
  },
  {
    kind: "subagent", who: "Explore", time: "02:31:40",
    summary: "<b>Agent</b> spawned <code>Explore</code> — “find every top-level event type in the example logs.”",
    badges: [{t:"subagent", c:"agent"}, {t:"45,231 tok", c:"tok"}, {t:"12 tools", c:""}],
    detail: { section: "Subagent — Explore", kv: {
      "agent_id": "agent-ae2065…95e", "agent_type": "Explore",
      "spawned_by": "toolu_07Qz…b1",
      "total_tokens": "45,231", "tool_uses": "12" },
      text: "Description: “Explore the example logs and enumerate every distinct top-level event `type` value, with counts.”\n\n→ opens its own nested story (same document shape, recursively)." }
  },
  {
    kind: "system", who: "system", time: "02:35:02",
    summary: "Stop hook summary — turn complete in 12.3s across 41 messages.",
    badges: [{t:"hook", c:""}],
    detail: { section: "System event", kv: {
      "level": "info", "turn_duration": "12,340 ms", "message_count": "41",
      "prevented_continuation": "false" },
      text: "stop_hook_summary — deferred to a later version (hooks). Shown here as summary-only for now." }
  },
];

const KIND_LABEL = {
  user: "User", assistant: "Assistant", thinking: "Thinking",
  tool_call: "Tool Call", tool_result: "Tool Result",
  subagent: "Subagent", system: "System"
};

/* ---- render cards ---- */
const cardsEl = document.getElementById('cards');
EVENTS.forEach((ev, i) => {
  const card = document.createElement('article');
  card.className = `card k-${ev.kind}`;
  card.dataset.i = i;
  card.innerHTML = `
    <div class="gutter">
      <span class="kind">${KIND_LABEL[ev.kind]}</span>
      <span class="who">${ev.who}</span>
    </div>
    <div class="body">
      <div class="summary">${ev.summary}</div>
      ${ev.badges.length ? `<div class="badges">${ev.badges.map(b=>`<span class="badge ${b.c}">${b.t}</span>`).join('')}</div>` : ''}
    </div>
    <div class="aside"><span class="time">🕑 ${ev.time}</span><span class="tz">UTC</span></div>`;
  card.addEventListener('click', () => {
    if (card.classList.contains('active')) { clearSelection(); }
    else { selectCard(i); }
  });
  cardsEl.appendChild(card);
});

/* ---- detail rendering ---- */
const body = document.body;
const sidebar = document.getElementById('sidebar');
const dKind = document.getElementById('d-kind');
const dTime = document.getElementById('d-time');
const dBody = document.getElementById('d-body');

function selectCard(i) {
  document.querySelectorAll('.card').forEach(c => c.classList.remove('active'));
  const card = document.querySelector(`.card[data-i="${i}"]`);
  card.classList.add('active');
  const ev = EVENTS[i];

  body.classList.remove('sidebar-collapsed');
  dKind.textContent = KIND_LABEL[ev.kind];
  dTime.textContent = ev.time + ' UTC';
  sidebar.style.setProperty('--kind', getComputedStyle(card).getPropertyValue('--kind'));

  const d = ev.detail;
  let html = '';
  html += `<div class="d-section"><h4>${d.section}</h4>`;
  if (d.text)  html += `<div class="d-text">${escapeHtml(d.text)}</div>`;
  html += `</div>`;

  if (d.kv) {
    html += `<div class="d-section"><h4>Fields</h4><dl class="kv">`;
    for (const [k,v] of Object.entries(d.kv)) html += `<dt>${k}</dt><dd><code>${v}</code></dd>`;
    html += `</dl></div>`;
  }
  if (d.tokens) {
    html += `<div class="d-section"><h4>Tokens</h4><div class="token-grid">`;
    for (const [k,v] of Object.entries(d.tokens))
      html += `<div class="cell"><div class="k">${k.replace(/_/g,' ')}</div><div class="v">${v.toLocaleString()}</div></div>`;
    html += `</div></div>`;
  }
  if (d.stop_reason) {
    html += `<div class="d-section"><h4>Turn</h4><dl class="kv"><dt>stop_reason</dt><dd><code>${d.stop_reason}</code></dd></dl></div>`;
  }
  if (d.code) {
    html += `<div class="d-section"><h4>Input</h4><pre class="code">${escapeHtml(d.code)}</pre></div>`;
  }
  html += `<div class="d-section"><h4>Provenance</h4><dl class="kv">
    <dt>source.file</dt><dd><code>episode-8-before.jsonl</code></dd>
    <dt>source.line</dt><dd><code>${42 + i*17}</code></dd>
    <dt>agent</dt><dd><code>${ev.kind==='subagent'?'agent-ae2065…95e':'main'}</code></dd>
  </dl></div>`;

  dBody.innerHTML = html;
  dBody.scrollTop = 0;
}

function escapeHtml(s){return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}

const EMPTY_HTML = `<div class="empty-detail">
    <div class="mark">❖</div>
    <p>Select an event to see its details.</p>
  </div>`;

/* deselect any card but keep the sidebar open and empty */
function clearSelection() {
  document.querySelectorAll('.card').forEach(c => c.classList.remove('active'));
  body.classList.remove('sidebar-collapsed');
  dKind.textContent = 'Detail';
  dTime.textContent = '';
  sidebar.style.setProperty('--kind', 'var(--gold)');
  dBody.innerHTML = EMPTY_HTML;
}

/* ---- collapse / reopen / clear ---- */
document.getElementById('d-close').addEventListener('click', () => body.classList.add('sidebar-collapsed'));
document.getElementById('d-clear').addEventListener('click', clearSelection);
document.getElementById('reopen').addEventListener('click', () => body.classList.remove('sidebar-collapsed'));

/* ---- drag to resize ---- */
const resizer = document.getElementById('resizer');
let dragging = false;
resizer.addEventListener('mousedown', e => { dragging = true; body.classList.add('resizing'); e.preventDefault(); });
window.addEventListener('mousemove', e => {
  if (!dragging) return;
  const w = Math.min(720, Math.max(300, window.innerWidth - e.clientX));
  document.documentElement.style.setProperty('--sidebar-w', w + 'px');
});
window.addEventListener('mouseup', () => { dragging = false; body.classList.remove('resizing'); });

/* open the first assistant message by default so the page is never empty */
selectCard(2);
</script>
</body>
</html>
