  source:
    file: 4b0be952-d0bd-49ed-b97a-357b9149bf31.jsonl
    line: 100
  detail:
    text: "\U0001F955\U0001FA84 Good catch — and I think the evidence is already sitting
      in the repo, half-admitted.\n\n**Yes, I think you're right, and the code already
      half-agrees with you.**\n\nLook at what `notes/DESIGN-event-contract-v0.md`'s
      implementation notes say about `table.created`:\n\n> **The Spine authors `table.created`
      itself** (occurredIn `spine`) in response to `POST /tables` — it is never ingested
      through the events endpoint, which resolves the chicken-and-egg of an envelope
      requiring a `tableId` the Spine hasn't minted yet.\n\nThat line is already drawing
      your distinction, just for a narrower reason (bootstrapping the `tableId`).
      `table.created` never flows through the generic, envelope-validated, cross-service
      events endpoint — it's synthesized by the Spine as a record of something it
      just did. `seat.taken` looks like it works the same way (`POST /join` \"always
      takes a seat,\" per the Spine's `CLAUDE.md`). Those two are already not wire
      events between independently-deployed senders. They're the Spine's own account-keeping,
      wearing an event-shaped costume because that's the only shape `contracts/` currently
      offers.\n\n**Why the fit is wrong, not just accidental:** `contracts/README.md`
      defines the whole directory as \"the event contract the Spine *publishes* and
      every app translates itself into\" — a broadcast, to any number of subscribers,
      that a receiver might see late or never. And `notes/DESIGN-schema-evolution-policy.md`'s
      entire justification for the envelope/payload strictness split is deploy-skew
      tolerance *between independently-deployed broadcast subscribers*. Neither of
      those properties describes an RPC response. A response to `POST /tables` isn't
      published to anyone — it goes back down the one call stack that asked for it,
      synchronously, to a caller that's blocked waiting and needs a real error path
      (can't just \"ignore what it doesn't recognize\" — it has to decide what to
      tell the human right now). That's a different failure mode, different versioning
      discipline (more like normal API versioning between two named parties, not fire-and-forget-with-tolerant-receivers),
      and arguably a different validator shape (request schema + response schema per
      endpoint, not envelope+payload).\n\n**So I'd say:** the target architecture
      doesn't have a wire event for \"table created\" or \"seat taken\" at all — it
      has an API call and its response. What *does* still belong in `contracts/` for
      those two is the Spine's internal log-entry shape, but that's arguably not even
      a cross-service contract anymore — nothing outside the Spine validates against
      it once nothing outside the Spine ever receives it over the wire. `seat.joined`
      and `card.played` stay exactly where they are, because they really are broadcasts
      to subscribers the Spine doesn't control the deploy cadence of.\n\nOne thing
      I'd want to pin down before this becomes a ticket: does the Spine's persisted
      log entry for table creation need to be schema-validated *at all* going forward,
      or does it become just \"whatever shape the Spine's own code writes,\" with
      no external schema policing it? That's the part I'd actually ask you about when
      this stops being conceptual."
