  detail:
    text: |-
      Found it. Procedures for schema updates live in a few coordinated docs, depending on which kind of schema you mean.

      ## Event contract schemas (fleet-wide, cross-service)

      These are the JSON Schemas in `contracts/` that the Spine, Shuffler, and Tabletop all validate against. Three docs govern them:

      - **`contracts/README.md`** — the operative rules. Files layout (`envelope.vN.json`, `payloads/<name>.v<schemaVersion>.json`), the "both sides validate on receipt / fail loudly" rule, and the key update procedure: **never edit a shipped envelope version file in place — bump to a new `envelope.vN.json` instead**; payloads may be edited in place for additive optional fields because they're `additionalProperties: true`.
      - **`notes/DESIGN-schema-evolution-policy.md`** — *why* the rules are what they are (decided 2026-08-12): envelope schemas stay strict (`additionalProperties: false`) permanently; payload schemas are permissive. Read this before changing either policy.
      - **`notes/DESIGN-event-contract-v0.md`** — the original six v0 decisions, including Decision 5 on versioning mechanics.

      ## Persisted-data schemas (Shuffler-local)

      - **`apps/shuffler/notes/DESIGN-persistence-versioning.md`** — the stricter stance for save files: *any* change to a persisted shape (additive or not) bumps a version constant, and old data fails loudly rather than being silently coerced. Different problem from wire events (one reader, no deploy-ordering), so it deliberately doesn't follow the contract policy.

      ## Interpreter snapshots (Spine)

      - **`services/spine/interpreter/docs/journeys/adr/0009-snapshot-schema-versioning.md`** (with `0008-snapshots.md`) — snapshot schema versioning for the interpreter.

      **Short version:** for the cross-service event contract, start at `contracts/README.md` for the how and `notes/DESIGN-schema-evolution-policy.md` for the why. The one-line rule: bump the envelope file for envelope changes; edit payload schemas in place only for additive optional fields.

      result: Schema-update procedures are documented in `contracts/README.md` (rules) + `notes/DESIGN-schema-evolution-policy.md` and `notes/DESIGN-event-contract-v0.md` (reasoning) for the fleet event contract; `apps/shuffler/notes/DESIGN-persistence-versioning.md` for persisted data; and the Spine interpreter's ADR 0008/0009 for snapshots.
