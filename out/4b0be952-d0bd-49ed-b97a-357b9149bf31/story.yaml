  detail:
    text: "60\t  alphabetical rank in a known decklist. It used to be barred from
      crossing the\n61\t  Shuffler's boundary as \"a decodable secret\" — reversed
      at `let-gamecardindex-out`\n62\t  (2026-08-10): decklists are public on Archidekt
      anyway, so decoding the index\n63\t  reveals nothing a trust-based table couldn't
      already look up, and the guard was\n64\t  only making every future payload reason
      about what may cross. `card.played` now\n65\t  sends it alongside the opaque
      instance GUID, not instead of it.)\n66\t- Minting scope — **DECIDED: per game**,
      at game start (Jess confirmed \"this\n67\t  game\"). \"Same physical card across
      game nights\" (persisting instance ids into\n68\t  deck files) is a noted future
      upgrade, fragile today because deck files are\n69\t  regenerated from Archidekt/MTGJSON.\n70\t\n71\tContract
      shape: `card: { scryfallId, instanceId }` + sibling `face` where the event\n72\tneeds
      it. Downstream consequence: the Tabletop should stamp `instanceId` into each\n73\tcard
      shape's `meta`, so future physical events (`card.moved`, tap) reference the\n74\tsame
      individual the game events do.\n75\t\n76\t## Decision 1: The envelope — v2,
      renames from round 1 applied\n77\t\n78\t| field           | who writes it              |
      what it's for                                                                                                                                                                 |\n79\t|
      --------------- | -------------------------- | -----------------------------------------------------------------------------------------------------------------------------------------------------------------------------
      |\n80\t| `id`            | **sender** mints a GUID    | idempotency — the Spine
      elides a retried duplicate                                                                                                                            |\n81\t|
      `tableId`       | sender (after learning it) | which table's log. A GUID the
      **Spine mints at table creation** — the table _name_ is a lookup alias, unique
      only among active tables, living in the `table.created` payload. |\n82\t| `seq`
      \          | **Spine**, on append       | authoritative order within the log;
      senders cannot claim positions                                                                                                            |\n83\t|
      `name`          | sender                     | the event's kind, namespaced
      (`card.played`); determines the payload schema. (No `scope` field in v0 — see
      Decision 6)                                                        |\n84\t|
      `acceptedAt`    | **Spine**, on append       | Spine's clock: when the log accepted
      it                                                                                                                                       |\n85\t|
      `occurredAt`    | sender, optional           | the initiator app's clock, when
      physics preceded ingestion                                                                                                                    |\n86\t|
      `initiator`     | sender                     | _who_ made this happen: a seat,
      a named spectator, later the interpreter                                                                                                      |\n87\t|
      `occurredIn`    | sender                     | _which application_ recorded/sent
      it: `shuffler`, `tabletop`, `spine`, later `interpreter`                                                                                    |\n88\t|
      `visibility`    | sender                     | `public` — the only legal value
      in v0; see Decision 4                                                                                                                         |\n89\t|
      `traceparent`   | sender                     | W3C trace context — **observability
      only**, expires with the trace (60d); the admin screen links through it to Honeycomb
      \                                                     |\n90\t| `schemaVersion`
      | sender                     | integer version of this `name`'s payload schema
      \                                                                                                                              |\n91\t|
      `payload`       | sender                     | the kind-specific body                                                                                                                                                        |\n92\t\n93\t**The
      split in one line:** uniqueness travels with the event (sender GUID);\n94\ttruth-of-order
      and truth-of-time stay with the log (Spine-assigned `seq`,\n95\t`acceptedAt`).\n96\t\n97\t##
      Decision 2: The v0 event catalog — DECIDED (three kinds)\n98\t\n99\t- `table.created`
      — payload: table name, creator. Response/log carries the minted `tableId`.\n100\t-
      `seat.taken` — payload: `seatId` (a short GUID — player names are not unique;\n101\t
      \ seat identity is its own thing, mintable as a sequence once the Spine owns
      it),\n102\t  seat number (1–4), player name (display only)\n103\t- `card.played`
      — from the Shuffler (Decision 3: **decided, game event**) —\n104\t  payload:
      `card: { scryfallId, instanceId }`, `face`, from which seat, zone hint\n105\t\n106\tNear-future,
      not v0: **more Shuffler game events** — it deterministically knows\n107\tmore
      than it says (`card.picked_up`, and the public shadows: drew a card, mulliganed,\n108\tshuffled)
      — cheap to add once `card.played` flows, since it's the same pipe. Also\n109\tnear-future:
      the Tabletop reporting the _physical_ echo (`card.arrived`)\n110\tonce it talks
      to the Spine — mostly ignored by interpretation because\n111\tit's expected;
      **interesting precisely when it doesn't arrive**. Also not v0: card\n112\tmovement/tap,
      chat, interpretation events. Kinds arrive when their producers do.\n113\t\n114\t##
      Decision 3: Game event vs. physical — DECIDED: (a) game event\n115\t\n116\tThe
      Shuffler is a deterministic, not-interpreted app: when it plays a card it knows\n117\tthe
      meaning, so it says so — `card.played`. Physical events are\n118\treserved for
      genuinely observed/ambiguous happenings (the Tabletop's world), and the\n119\tphysical
      echo of a game event is a separate, expected, low-drama event (see\n120\tDecision
      2). This seeds the log with ground-truth game events for the Interpreter's\n121\teval
      dataset.\n122\t\n123\t## Decision 4: Visibility — RESOLVED for v0: everything
      is `public`\n124\t\n125\tAnswering round 1's question directly: **no, the Spine
      does not receive seat-private\n126\tevents in v0** — the Shuffler was never
      going to send both halves of a pair; it\n127\tsends only the public shadow of
      what it privately knows (\"seat 2 drew a card\",\n128\tnever which card). So
      v0's enum is exactly `public`, and the pair/shadow mechanics\n129\tare deferred
      until a producer actually wants to log a private fact. Envelope\n130\tfuture-proofing
      kept: when shadows arrive, a shadow references the `id` of the event\n131\tit
      shadows; adding an enum value is an envelope version bump that old readers reject\n132\tloudly.
      (Whether the Spine _ever_ holds seat-private facts is a real future\n133\tdecision,
      not assumed.)\n134\t\n135\t## Decision 5: Versioning mechanics — DECIDED\n136\t\n137\t-
      Each event `name` versions its payload schema independently (`schemaVersion:
      1`\n138\t  under `name: seat.taken`).\n139\t- The envelope itself carries one
      version (file-level in `contracts/`), bumped\n140\t  rarely.\n141\t- Both readers
      validate on receipt and **fail loudly** on unknown name or version —\n142\t
      \ consistent with `apps/shuffler/notes/DESIGN-persistence-versioning.md`.\n143\t\n144\tWhere
      TS receives events: eventually the **Tabletop subscribes to a table's public\n145\tfeed**
      from the Spine — it needs `card.played` to put things on the stack — and that\n146\tsubscription
      is where TS-side contract validation lives. (In v0's scaffolding the\n147\tShuffler
      POSTs to the Tabletop directly; the code carries `// JES-128` markers where\n148\tvalidation
      will land.)\n149\t\n150\t**Revisited (2026-08-12):** \"fail loudly on unknown
      name or version\" turned out to have\n151\tbeen implemented as \"fail loudly
      on *any* unrecognized field, anywhere, including the\n152\tpayload\" — stricter
      than decided here, and it broke the first payload change that added\n153\tan
      optional field (`colors-from-playmat-to-life-counter` ticket 02). The envelope
      keeps\n154\tfailing loudly on anything unrecognized; payloads now ignore fields
      they don't know\n155\tabout. Full reasoning in `notes/DESIGN-schema-evolution-policy.md`.\n156\t\n157\t##
      Decision 6: `scope` — DECIDED: leave it off v0\n158\t\n159\tRound 1's insight
      stands: filtering wants a dimension that payload-schema naming\n160\tdoesn't
      give — _what the event affects / how it's perceived_ (affects the table;\n161\taffects
      the game; visible; audible, conceptually including chat). But we don't know\n162\twhat
      the scopes actually are yet (one or many per event? where does\n163\t`interpretation.*`
      sit?), so v0 ships **`name` only** — namespaced for humans\n164\t(`card.played`,
      `seat.taken`), determining the payload schema.\n165\t\n166\tWhen real filtering
      needs teach us the scope values, adding the field is an\n167\tenvelope version
      bump — old readers reject it loudly, by design. Until then the\n168\tSpine's
      projections and the admin screen can filter on `name` prefixes, which is\n169\tplenty
      at three event kinds.\n170\t\n171\t## v0 implementation notes (from the walking
