      Here's a question. The contracts/ currently document events.
      But some actions take place as API calls -- in the target architecture, table creation happens Shuffler -> POST -> Spine -> Tabletop (API call, needs a response) -> respond to Shuffler. The Spine will save what happened as an event in its log, that's fine.
      But the communication about that will be and should be synchronous API calls. Events like table.created and seat.taken _as events_ are really for the Spine's log, and will be the Spine's business. (That's future, so it's nothing to change right now.)

      Here's my question, and it's conceptual not practical. Should contracts/ be documenting the API calls between services instead of table.created and seat.joined? (the other events actually will be sent from Spine to the other ships and clearly belong here)
