  detail:
    text: |-
      Good — that confirms the Shuffler doesn't runtime-validate outbound events against the JSON Schema; it relies on TypeScript types matching the contract, with a comment noting the envelope shape. Now I have the full picture.

      ## How contract validation works

      Two independent runtime validators, one per receiving side — **not shared code, shared schema files** (`contracts/`), per `contracts/README.md`'s "not shared types — shared schemas" rule.

      **Spine (Ruby), `services/spine/lib/event_contract.rb`** — gate for `POST /tables/:table_id/events`:
      1. Uses the `json_schemer` gem, schemas loaded from `contracts/` (repo-root, overridable via `CONTRACTS_DIR`) and cached per file in `@schema_cache`.
      2. `validate!(envelope)` runs in order:
         - Rejects non-Hash bodies outright.
         - Rejects if the sender set `seq` or `acceptedAt` — those are Spine-assigned on append (`SpineOwnedField`).
         - Validates the whole envelope against the pinned `envelope.v3.json` (`ENVELOPE_VERSION = 3`, hardcoded).
         - Looks up `payloads/<name>.v<schemaVersion>.json` from the envelope's own `name`/`schemaVersion` fields; missing name, non-integer version, or missing file → `UnknownEvent`.
         - Validates `envelope["payload"]` against that payload schema.
      3. Any failure raises a typed `Violation` (or subclass), which the route turns into an HTTP **422**.

      **Tabletop (TS), `apps/tabletop/src/server/contractValidation.ts`** — gate for its two SCAFFOLDING endpoints (`seat.joined`, `card.played`):
      1. Uses `ajv` (`Ajv2020` + `ajv-formats`), schemas loaded from `contracts/` and compiled once at module load into `validateEnvelopeSchema` plus a `payloadValidators` map keyed `"name:schemaVersion"` — so unlike the Spine, only the two event kinds this app actually consumes are pre-registered, and it's pinned to `envelope.v2.json`, not v3.
      2. `validateIncomingEvent(body, expectedName)`:
         - Validates against the envelope schema.
         - Checks `envelope.name === expectedName` (defense against posting the wrong event to the wrong endpoint).
         - Looks up the payload validator by `name:schemaVersion`; missing → error.
         - Runs the payload validator.
      3. Returns a `{ok:true, envelope} | {ok:false, error}` result rather than throwing — the caller decides the HTTP response.

      **Shuffler** — the sender in most of these flows — does **not** runtime-validate outbound events against the JSON Schema at all. It relies on TypeScript types (`port-tabletop/types.ts`) staying in sync with the contract by hand; `HttpSpineGateway.ts` has a comment flagging where it strips `traceparent` before serializing per the envelope schema, but there's no `ajv`/`json_schemer` call on that side.

      **Shared enforcement rule** (from `contracts/README.md`, backed by `DESIGN-schema-evolution-policy.md`): envelope schemas are `additionalProperties: false` (strict — unknown fields hard-fail) while payload schemas are `additionalProperties: true` (unknown fields pass through silently), so a receiver one deploy behind a sender degrades gracefully on payload additions but still catches envelope drift immediately. Both validators enforce this the same way because it's baked into the schema files themselves, not into either validator's code.

      One inconsistency worth knowing: the Tabletop is still pinned to `envelope.v2.json` while the Spine validates against `v3` — so the Tabletop wouldn't reject a v3-only field, it just wouldn't know to expect it either, since it's not asking that question at all.
