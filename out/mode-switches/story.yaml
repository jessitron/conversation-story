  detail:
    text: |-
      Yes — and the log's shape backs you up. The mode records are timestamp-less bookkeeping written as a trio with `last-prompt` right after each submission:

      ```
        7  16:28:29  user             Can you find conversation f9f81f1e-…
       12            last-prompt      ← the text just submitted
       13            mode             normal
       14            permission-mode  auto
      ```

      So it isn't an event that happens, it's **state stamped at submission** — exactly a field on the prompt. That also kills the "right-aligned" problem: on a `user_message` card the field is already on the right-hand side.

      Concretely: the parser carries the last-seen `mode` / `permissionMode` forward and attaches both to each `user_message` as named fields (line 2/3 establishes the opening state before the first prompt at line 7, so every prompt has a value). Then `mode`/`ai-title`/`file-history-delta` stay hidden as records — they've done their job by informing the prompt.

      One choice left:
