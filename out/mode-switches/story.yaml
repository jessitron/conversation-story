      This session is now `examples/mode-switches.jsonl` — 214 lines, rendered to `out/mode-switches/`.

      **But it still has no switch**, and here's the mechanism you'll want for your script: the log stamps mode **once per user prompt**, not at the moment of the toggle. Every stamp in this session is `mode=normal` + `permissionMode=auto` — including the pair at lines 191/192, straddling the plan-mode entry and exit that happened earlier in this very conversation. That was me entering plan mode via a tool, and it left no trace in the stamps.

