      => (chars / CHARS_PER_TOKEN).round,\n447\t      }\n448\t    end\n449\t\n450\t
      \   # The human-relevant body of a (visible) attachment: `queued_command` carries\n451\t
      \   # a `prompt` (the delivered notification/input); other attachments may carry
      a\n452\t    # `content` array of text blocks.\n453\t    def attachment_detail_text(rec)\n454\t
      \     att = rec[\"attachment\"] || {}\n455\t      return att[\"prompt\"].to_s
      if att[\"prompt\"]\n456\t\n457\t      extract_text(att[\"content\"])\n458\t
      \   end\n459\t\n460\t    # (b) named token + turn fields on assistant turns.\n461\t
      \   def add_assistant_fields(event, rec)\n462\t      msg = rec[\"message\"]
      || {}\n463\t      event[\"model\"]         = msg[\"model\"] if msg[\"model\"]\n464\t
      \     event[\"stop_reason\"]   = msg[\"stop_reason\"]\n465\t      event[\"stop_details\"]
      \ = msg[\"stop_details\"]\n466\t      event[\"stop_sequence\"] = msg[\"stop_sequence\"]\n467\t\n468\t
      \     # `message.id` is what makes a TURN visible in the schema: the thinking\n469\t
      \     # record, the text record and each tool_use record of one API response
      all\n470\t      # carry it. mark_turns! groups on it, and the renderer uses
      it to show an\n471\t      # assistant message the tool calls that came back
      with it.\n472\t      event[\"links\"] = { \"message_id\" => msg[\"id\"] } if
      msg[\"id\"]\n473\t\n474\t      usage = msg[\"usage\"]\n475\t      return unless
      usage.is_a?(Hash)\n476\t\n477\t      event[\"tokens\"] = {\n478\t        \"input\"
      \         => usage[\"input_tokens\"],\n479\t        \"output\"         => usage[\"output_tokens\"],\n480\t
      \       \"cache_creation\" => usage[\"cache_creation_input_tokens\"],\n481\t
      \       \"cache_read\"     => usage[\"cache_read_input_tokens\"],\n482\t        \"ephemeral_1h\"
      \  => usage.dig(\"cache_creation\", \"ephemeral_1h_input_tokens\"),\n483\t        \"ephemeral_5m\"
      \  => usage.dig(\"cache_creation\", \"ephemeral_5m_input_tokens\"),\n484\t        \"service_tier\"
      \  => usage[\"service_tier\"],\n485\t      }\n486\t    end\n487\t\n488\t    #
      ---- assistant turns -----------------------------------------------------\n489\t
      \   #\n490\t    # One API response can span several records — a thinking block,
      a text\n491\t    # block, and one record per tool_use, all sharing `message.id`
      — and EVERY\n492\t    # one of them repeats the whole turn's `usage`. So token
      counts are a fact\n493\t    # about the TURN, not the record: attributing them
      per record would triple\n494\t    # count a running total, and would print the
      same numbers on three cards.\n495\t    #\n496\t    # Each turn therefore elects
      a `turn_leader`, the one record that shows the\n497\t    # numbers: the assistant_message
      record when the turn produced prose, and\n498\t    # the turn's first record
      otherwise. The fallback is not hypothetical — 7 of\n499\t    # 33 turns in episode-8-before
      (11 of 28 in episode-8-after) are bare\n500\t    # tool_use with no text block,
      and without it their tokens, and the jump\n501\t    # they cause in the running
      total, would appear on no card at all."
