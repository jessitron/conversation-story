  source:
    file: mode-switches.jsonl
    line: 164
  detail:
    text: |-
      Done — it's in and green.

      **`examples/inlining-subagents.jsonl`** (from `f9f81f1e`): the session where we implemented subagent inlining under Mount Complete — Jess's prompts run "implement subagents under Mount Complete" → open by default → `[AGENT]` badge → consistent font size → top-align. That's exactly the last five commits, so the name matches what it did.

      - 683 lines / 449 visible, 66 min, opus-5, no subagents of its own
      - Rendered at `out/inlining-subagents/`, listed on the landing page
      - `rake test` 112 runs, 0 failures (2 skips — see below); `bin/check-anchors` and `bin/check-modes` both pass against it

      **What it exposed:** this log carries three record types the episode-8 fixtures never had — `mode`, `ai-title`, `file-history-delta` — all of which fell to the `unknown` fallback and broke `only_expected_unknowns`. They're now recognized harness kinds (`file-history-delta` → `file_snapshot`, `mode` → `permission_mode` with the field name it actually uses, `ai-title` → a new hidden `ai_title` kind that keeps the title in `detail.text`, so naming the kind loses nothing). That landed in `3eaf0ee`/`559c981`.

      It also had no Agent calls, and two subagent tests asserted *every* example spawns one. Those now `skip` when a log doesn't delegate — that's the 2 skips.

      Two things to flag:

      1. **Size.** The log is 6.8 MB and `out/inlining-subagents/` is another 2.3 MB, all committed. That's ~9 MB added to a repo whose examples were 550 KB. Fine once; worth a policy if you keep adding sessions.
      2. **`meta.total_tokens` reads 32.8 M** — 27× episode-8-before, because this session ran a large context over ~150 turns. Accurate per the session-13 definition (token *use*, not context size), but that header stat is going to look startling next to the others.

      Separately: `examples/mtg-tabletop-plan` showed up in the working tree from earlier work and is now committed too — I didn't touch it, just noting it rode along.
