      Two consequences for the design, once you have that log:

      - The card belongs at the prompt where the new mode **first applies**, not at a separate "switch" moment — the log has no record of the toggle itself.
      - There are two independent dimensions stamped per prompt (`mode`: normal/plan, `permissionMode`: auto/acceptEdits/…), so a single toggle may move one or both.

