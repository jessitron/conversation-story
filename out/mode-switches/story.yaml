  source:
    file: mode-switches.jsonl
    line: 314
  tool:
    name: Write
    use_id: toolu_01PtMfgsXyyzqaxqc4YrPTo7
    input:
      file_path: "/private/tmp/claude-501/-Users-jessitron-code-jessitron-conversation-story/440d0870-ee5a-490c-be58-a6f1c046b7bb/scratchpad/mode-badge-demo"
      content: |
        #!/usr/bin/env ruby
        # frozen_string_literal: true
        #
        # Builds a throwaway story containing an actual mode switch (no example log has
        # one yet) so the [PLAN] badge can be LOOKED at, and screenshots the card.
        # Everything lands in the scratchpad; out/ is untouched.

        require "json"
        require "fileutils"

        REPO  = "/Users/jessitron/code/jessitron/conversation-story"
        SCRAP = __dir__
        SITE  = File.join(SCRAP, "site")
        FileUtils.mkdir_p(File.join(SITE, "mode-demo"))

        def user(seq, text)
          { "type" => "user", "uuid" => "u#{seq}", "sessionId" => "demo", "gitBranch" => "main",
            "cwd" => REPO, "version" => "2.1.220",
            "timestamp" => "2026-07-28T1#{seq}:00:00.000Z",
            "message" => { "role" => "user", "content" => text } }
        end

        def assistant(seq, text)
          { "type" => "assistant", "uuid" => "a#{seq}", "sessionId" => "demo", "gitBranch" => "main",
            "cwd" => REPO, "version" => "2.1.220",
            "timestamp" => "2026-07-28T1#{seq}:30:00.000Z",
            "message" => { "role" => "assistant", "id" => "msg_#{seq}", "model" => "claude-opus-5",
                           "content" => [{ "type" => "text", "text" => text }],
                           "usage" => { "input_tokens" => 100, "output_tokens" => 50,
                                        "cache_read_input_tokens" => 1000 } } }
        end

        log = File.join(SCRAP, "mode-demo.jsonl")
        File.open(log, "w") do |f|
          [
            { "type" => "mode", "mode" => "normal" },
            { "type" => "permission-mode", "permissionMode" => "auto" },
            user(1, "Let's just look at the parser for a second."),
            { "type" => "last-prompt", "lastPrompt" => "look at the parser" },
            { "type" => "mode", "mode" => "normal" },
            assistant(1, "Sure — here's what it does."),
            user(2, "Actually, plan this out before you touch anything."),
            { "type" => "last-prompt", "lastPrompt" => "plan this out" },
            { "type" => "mode", "mode" => "plan" },
            { "type" => "permission-mode", "permissionMode" => "plan" },
            assistant(2, "Planning first, then."),
            user(3, "ok go"),
            { "type" => "mode", "mode" => "plan" },
            assistant(3, "Off we go."),
          ].each { |r| f.puts JSON.generate(r) }
        end

        yaml = File.join(SITE, "mode-demo", "story.yaml")
        system("ruby", "#{REPO}/bin/parse", log, "-o", yaml, chdir: REPO, exception: true)
        system("ruby", "#{REPO}/bin/render", yaml, "-o", File.join(SITE, "mode-demo", "index.html"),
               chdir: REPO, exception: true)

        png = File.join(SCRAP, "mode-badge.png")
        system("/Applications/Google Chrome.app/Contents/MacOS/Google Chrome",
               "--headless", "--disable-gpu", "--hide-scrollbars",
               "--window-size=1400,1200", "--screenshot=#{png}",
               "--virtual-time-budget=2000",
               "file://#{File.join(SITE, "mode-demo", "index.html")}#mode-demo:7",
               out: File::NULL, err: File::NULL)
        puts png
    primary_arg: mode-badge-demo
