  summary: 'Done — it''s in and green. examples/inlining-subagents.jsonl (from f9f81f1e):
    the session where we implemented subagent inlining under Mount Complete — Jess''s
    prompts run "implement subagents under Mount Complete" → open by default → [AGENT]
