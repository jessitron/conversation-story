  source:
    file: mode-switches.jsonl
    line: 372
  detail:
    text: |-
      Done and committed as `01c241e`. Tests: 139 runs, 0 failures.

      **What the log's shape decided:** the mode is state stamped at submission, so it's a field on the `user_message` — and that makes right-alignment free, since prompt cards already right-align their content.

      The one thing worth knowing, because it's easy to get backwards: **the stamp to read is the one *after* the prompt.** The stamp before it still holds the previous submission's mode, so reading backwards credits a switch to the following prompt — one too late, in exactly the case the feature exists for. Backwards is only the fallback for a prompt with no stamp after it (last prompt of a session, or a mid-session snapshot like `mode-switches`).

      Behavior:
      - **Detail pane** gets a `Mode` section on every prompt — `Mode: normal`, `Permissions: auto`
      - **Card face** gets a badge only when the value moved, deduped by value (switching into plan moves both `mode` and `permissionMode`, and two `PLAN` badges say nothing the one says)
      - The opening state isn't a switch, so first prompts are never badged
      - The episode-8 logs predate the `mode` record, so they show `Permissions` only

      Since no fixture has a switch, I verified the badge against a hand-built log — one prompt in `normal`, the next sent after a shift-tab to plan:

      Card face reads `PLAN` (filled blue, matching the user card's accent) on the switched prompt only; the pane shows `Mode plan` / `Permissions plan`. Two new tests in `parser_test.rb` pin the direction and the dedupe, built from Tempfile logs through the real parser and renderer — `notes/intermediate-schema.md` and `CLAUDE.md` both warn against "simplifying" it to most-recent-preceding.

      `examples/mode-switches.jsonl` is still the switch-free snapshot. When you want a real one in the fixtures: shift-tab into plan, send a prompt, and I'll re-run `bin/grab-example 440d0870-ee5a-490c-be58-a6f1c046b7bb mode-switches` — the badge will then show up on a real card instead of a synthetic one.
