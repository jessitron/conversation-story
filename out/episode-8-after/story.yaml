          \ const prevCustomVersionRef = useRef(iconCustomizationVersion)\n109\t  if
          (prevCustomVersionRef.current !== iconCustomizationVersion) {\n110\t    prevCustomVersionRef.current
          = iconCustomizationVersion\n111\t    generationRef.current++\n112\t  }\n113\t\n114\t
          \ const generation = generationRef.current\n115\t\n116\t  const visibleEvents
          = useMemo(\n117\t    () => events.filter((e) => Date.now() - e.timestamp
