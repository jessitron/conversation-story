          } from '@/components/shared/agent-label'\n8\timport type { Agent, ParsedEvent
          } from '@/types'\n9\t\n10\t// Renders event dots with CSS-driven drift animation.\n11\t//
          Each dot mounts at its current position and CSS-transitions to -5% (off-screen).\n12\t//
          On scale change, all dots are unmounted and remounted via a key change.\n13\tfunction
          DotContainer({\n14\t  events,\n15\t  rangeMs,\n16\t  generation,\n17\t  setScrollToEventId,\n18\t}:
          {\n19\t  events: ParsedEvent[]\n20\t  rangeMs: number\n21\t  generation:
          number\n22\t  setScrollToEventId: (id: number | null) => void\n23\t}) {\n24\t
          \ return (\n25\t    <>\n26\t      {events.map((event) => {\n27\t        const
          age = Date.now() - event.timestamp\n28\t        const position = 100 - (age
          / rangeMs) * 100\n29\t        if (position < -10 || position > 100) return
          null\n30\t\n31\t        const remainingMs = Math.max(0, rangeMs - age)\n32\t
          \       const Icon = getEventIcon(event.subtype, event.toolName)\n33\t        const
          { dotColor, customHex } = getEventColor(event.subtype, event.toolName)\n34\t
          \       const summary = getEventSummary(event)\n35\t\n36\t        return
          (\n37\t          <Tooltip key={`${event.id}-${generation}`}>\n38\t            <TooltipTrigger
          asChild>\n39\t              <button\n40\t                className=\"absolute
          top-1/2 -translate-y-1/2 -translate-x-1/2 cursor-pointer hover:scale-125\"\n41\t
          \               style={{ left: `${position}%` }}\n42\t                ref={(el)
          => {\n43\t                  if (!el) return\n44\t                  // Start
          drift: set position without transition, then animate to off-screen\n45\t
          \                 requestAnimationFrame(() => {\n46\t                    el.style.transition
          = `left ${remainingMs}ms linear`\n47\t                    el.style.left
          = '-5%'\n48\t                  })\n49\t                }}\n50\t                onClick={()
          => setScrollToEventId(event.id)}\n51\t              >\n52\t                <span
          className={cn('flex items-center justify-center h-5 w-5 rounded-full', !customHex
          && dotColor)} style={customHex ? { backgroundColor: customHex } : undefined}>\n53\t
          \                 <Icon className=\"h-3 w-3 text-white\" />\n54\t                </span>\n55\t
          \             </button>\n56\t            </TooltipTrigger>\n57\t            <TooltipContent
          side=\"top\" className=\"text-xs max-w-64\">\n58\t              <div className=\"font-medium\">{tooltipLabel(event)}</div>\n59\t
          \             {summary && <div className=\"opacity-80 truncate\">{summary}</div>}\n60\t
          \           </TooltipContent>\n61\t          </Tooltip>\n62\t        )\n63\t
          \     })}\n64\t    </>\n65\t  )\n66\t}\n67\t\n68\tinterface AgentLaneProps
          {\n69\t  agent: Agent\n70\t  parentAgent?: Agent | null\n71\t  events: ParsedEvent[]\n72\t
          \ allEvents: ParsedEvent[]\n73\t  isSubagent: boolean\n74\t  color: string\n75\t}\n76\t\n77\t//
          Friendly label for tooltips\n78\tfunction tooltipLabel(event: ParsedEvent):
