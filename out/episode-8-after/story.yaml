          \   [events, rangeMs],\n120\t  )\n121\t\n122\t  // Tick marks based on time
          range\n123\t  const ticks = useMemo(() => {\n124\t    const rangeSec = rangeMs
          / 1000\n125\t    const count = { '1m': 6, '5m': 5, '10m': 5, '60m': 6 }[timeRange]\n126\t
          \   const stepSec = rangeSec / count\n127\t    const result: { pct: number;
          label: string }[] = []\n128\t    for (let i = 0; i <= count; i++) {\n129\t
          \     const sec = i * stepSec\n130\t      const pct = 100 - (sec / rangeSec)
          * 100\n131\t      let label: string\n132\t      if (i === 0) label = 'now'\n133\t
          \     else if (sec < 60) label = `${sec}s`\n134\t      else label = `${Math.round(sec
          / 60)}m`\n135\t      result.push({ pct, label })\n136\t    }\n137\t    return
          result\n138\t  }, [timeRange, rangeMs])\n139\t\n140\t  const handleAgentNameClick
          = useCallback(() => {\n141\t    // Find the first event from this agent
          across all events (sorted by id ascending)\n142\t    const agentEvents =
          allEvents.filter((e) => e.agentId === agentId)\n143\t    if (agentEvents.length
          > 0) {\n144\t      // Events are ordered by id; the first one is the earliest\n145\t
          \     const first = agentEvents.reduce((a, b) => (a.id < b.id ? a : b))\n146\t
          \     setScrollToEventId(first.id)\n147\t    }\n148\t  }, [allEvents, agentId,
          setScrollToEventId])\n149\t\n150\t  return (\n151\t    <div className=\"flex
          items-center h-8 border-b border-border/30\">\n152\t      <button\n153\t
          \       className={cn('w-40 shrink-0 text-[10px] truncate px-2 text-left
          cursor-pointer hover:underline', color, isSubagent ? 'opacity-80 dark:opacity-50'
          : 'opacity-100 dark:opacity-70')}\n154\t        onClick={handleAgentNameClick}\n155\t
          \     >\n156\t        {isSubagent ? '↳ ' : ''}\n157\t        <AgentLabel
          agent={agent} parentAgent={parentAgent} />\n158\t      </button>\n159\t\n160\t
          \     <div className=\"flex-1 relative h-full overflow-hidden\">\n161\t
          \       <DotContainer\n162\t          events={visibleEvents}\n163\t          rangeMs={rangeMs}\n164\t
          \         generation={generation}\n165\t          setScrollToEventId={setScrollToEventId}\n166\t
          \       />\n167\t\n168\t        {/* Time tick marks */}\n169\t        {ticks.map(({
