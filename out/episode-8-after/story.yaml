        text: "1\timport { useRef, useMemo, useCallback } from 'react'\n2\timport
          { cn } from '@/lib/utils'\n3\timport { getEventIcon, getEventColor } from
          '@/config/event-icons'\n4\timport { getEventSummary } from '@/lib/event-summary'\n5\timport
