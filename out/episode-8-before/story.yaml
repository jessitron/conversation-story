          replay mode** with **NO rewind, pause, or scrub functionality**:\n\n- **Event
          timestamps** are relative to \"now\" (`Date.now() - event.timestamp`)\n-
          Events automatically **drift off-screen** via CSS animation as time passes\n-
          The timeline only shows events within a selected **time range window** (1m,
          5m, 10m, 60m)\n- Dots representing events are positioned at `100 - (age
          / rangeMs) * 100` and animate to `-5%` (off-screen) as they age\n\n**Key
          evidence:**\n- `/Users/jessitron/code/simple10/agents-observe/app/client/src/components/timeline/agent-lane.tsx`
          (lines 26-29): \n  - `const age = Date.now() - event.timestamp`\n  - `const
          position = 100 - (age / rangeMs) * 100`\n  - No absolute timestamp seeking
          or playback head\n\n### 2. **Existing Pause/Follow Functionality**\n\nThere
          IS an **auto-follow toggle** (not a full pause):\n\n- **`autoFollow` state**
          in the UI store (defaults to `true`)\n- When enabled: automatically scrolls
          the event list to the bottom as new events arrive\n- When disabled: allows
          user to manually scroll and inspect older events without jumping\n- Located
          at `/Users/jessitron/code/simple10/agents-observe/app/client/src/components/main-panel/scope-bar.tsx`
          (lines 46-54)\n  - Button with \"ArrowDownToLine\" icon\n  - Toggles between
          `'default'` and `'ghost'` button variants\n\n**This is NOT true pause/rewind**,
          but rather:\n- Prevents automatic scroll-to-bottom when disabled\n- Allows
          users to examine event history while live events continue to arrive\n- Automatically
          disables when user expands an event row (to maintain context)\n\n### 3.
          **Key Files for Timeline & Time-Range Management**\n\n**Client-side (React):**\n\n1.
          **Timeline Components:**\n   - `/Users/jessitron/code/simple10/agents-observe/app/client/src/components/timeline/activity-timeline.tsx`
          - Main timeline container with time range selector (1m/5m/10m/60m buttons)\n
          \  - `/Users/jessitron/code/simple10/agents-observe/app/client/src/components/timeline/agent-lane.tsx`
          - Individual agent lanes with event dots and CSS-driven drift animation\n\n2.
          **State Management:**\n   - `/Users/jessitron/code/simple10/agents-observe/app/client/src/stores/ui-store.ts`
          (lines 67-70, 192-195)\n     - `timeRange: '1m' | '5m' | '10m' | '60m'`
