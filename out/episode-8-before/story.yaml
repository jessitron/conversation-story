  summary: '1 # Agents Observe 2 3 Real-time observability dashboard for Claude Code
    agents. 4 5 Includes powerful filtering, searching, and visualizat…'
  source:
    file: episode-8-before.jsonl
    line: 196
  detail:
    text: "1\t# Agents Observe\n2\t\n3\tReal-time observability dashboard for Claude
      Code agents.\n4\t\n5\tIncludes powerful filtering, searching, and visualization
      of multi-agent sessions.\n6\t\n7\t<p align=\"center\">\n8\t  <a href=\"https://raw.githubusercontent.com/simple10/agents-observe/videos/docs/assets/dashboard.gif\">\n9\t
      \   <img src=\"https://raw.githubusercontent.com/simple10/agents-observe/videos/docs/assets/dashboard.gif\"
      alt=\"Claude Observe Dashboard Demo\" />\n10\t  </a>\n11\t</p>\n12\t\n13\t<p>\n14\t<a
      href=\"https://raw.githubusercontent.com/simple10/agents-observe/videos/docs/assets/demo.mp4\">Demo
      video</a>\n15\t</p>\n16\t\n17\t<p align=\"center\">\n18\t  <img src=\"https://raw.githubusercontent.com/simple10/agents-observe/main/docs/assets/dashboard2.png\"
      alt=\"Claude Observe Dashboard Screenshot - Expanded Row\" />\n19\t</p>\n20\t\n21\tThe
      server and dashboard run locally or remotely, allowing multiple Claude Code
      instances to log full session data using hooks.\n22\t\n23\tHooks are used instead
      of OTEL to capture the full picture of agent actions.\n24\t\n25\t## Plugin Installation\n26\t\n27\t###
      Prerequisites\n28\t\n29\t- [Docker](https://www.docker.com/) (required — the
      server runs as a container)\n30\t- [Node.js](https://nodejs.org/) (required
      — hook scripts run via `node`)\n31\t\n32\t### Install\n33\t\n34\t1. Add the
      marketplace:\n35\t\n36\t   ```bash\n37\t   claude plugin marketplace add simple10/agents-observe\n38\t
      \  ```\n39\t\n40\t2. Install the plugin:\n41\t\n42\t   ```bash\n43\t   claude
      plugin install agents-observe\n44\t   ```\n45\t\n46\t3. Restart Claude Code.\n47\t\n48\tThat's
      it. On your next session, the server auto-starts as a Docker container and hooks
      begin capturing events. Open **<http://localhost:4981>** to see the dashboard.\n49\t\n50\t##
      Plugin Skills\n51\t\n52\t| Skill | Description |\n53\t|-------|-------------|\n54\t|
      `/observe` | Open the dashboard URL and check if the server is running |\n55\t|
      `/observe status` | Check server health and show dashboard URL |\n56\t\n57\t##
      Why observability matters\n58\t\n59\tWhen Claude Code runs autonomously — spawning
      subagents, calling tools, reading files, executing commands — you have no visibility
      into what's actually happening. The terminal shows a fraction of the activity.
      Subagents are invisible. Tool calls blur together. And when something goes wrong
      three agents deep in a parallel execution, you're left reading through logs
      after the fact.\n60"
