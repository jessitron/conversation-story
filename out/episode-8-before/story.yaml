  detail:
    text: "\n\n\U0001F955 Good questions, and fair criticism.\n\n**Why didn't I run
      `just install` first?** I should have checked whether `node_modules` existed
      before trying to start anything. I saw the justfile had an `install` recipe
      and skipped right past it. I assumed deps were already installed because it's
      a working project on your machine -- but of course, your regular install runs
      via Docker, which has its own deps. Lesson learned: always verify dependencies
      are installed before trying to run things locally.\n\n**The `data/` directory?**
      The justfile actually told me -- both the `start` and `start-local` recipes
      have `@mkdir -p {{ project_root }}/data` as their first step. I read that file
      and didn't absorb the implication. The `dev` recipe doesn't include it (probably
      because it's usually run alongside an existing Docker setup), but seeing that
      pattern should have tipped me off to create it preemptively.\n\nI'll save these
      as notes for next time."
