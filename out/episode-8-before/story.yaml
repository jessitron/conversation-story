      \   @just --list\n24\t\n25\t# ─── Docker ─────────────────────────────────────────────\n26\t\n27\t#
      Build the Docker image locally\n28\tbuild:\n29\t    docker build -t agents-observe:local
      .\n30\t\n31\t# Start docker container (detached)\n32\tstart:\n33\t    @mkdir
      -p {{ project_root }}/data\n34\t    @docker compose down >/dev/null 2>&1 ||
      true\n35\t    @docker rm -f agents-observe >/dev/null 2>&1 || true\n36\t    docker
      compose up -d --build\n37\t    @echo \"\"\n38\t    @echo \"Waiting for server...\"\n39\t
      \   @for i in $(seq 1 15); do \\\n40\t      if curl -sf http://localhost:{{
      port }}/api/health >/dev/null 2>&1; then \\\n41\t        echo \"Ready: http://localhost:{{
      port }}\"; \\\n42\t        break; \\\n43\t      fi; \\\n44\t      sleep 1; \\\n45\t
      \   done\n46\t    @just open\n47\t\n48\t# Start the server locally without docker\n49\tstart-local:\n50\t
      \   @mkdir -p {{ project_root }}/data\n51\t    npm run start\n52\t\n53\t# Stop
      containers\n54\tstop:\n55\t    @docker compose down >/dev/null 2>&1 || true\n56\t
      \   @docker rm -f agents-observe >/dev/null 2>&1 || true\n57\t\n58\t# Restart
      containers\n59\trestart: stop start\n60\t\n61\t# View container logs (follow)\n62\tlogs:\n63\t
      \   docker compose logs -f\n64\t\n65\t# ─── Development ─────────────────────────────────────────\n66\t\n67\t#
      Start local server + client in dev mode (hot reload)\n68\tdev:\n69\t    #!/usr/bin/env
      bash\n70\t    echo \"Starting dev server + client...\"\n71\t    echo \"Server:
      http://localhost:{{ port }}\"\n72\t    echo \"Client: http://localhost:{{ dev_client_port
      }} (Vite dev)\"\n73\t    echo \"\"\n74\t    cd {{ server }} && npm run dev &\n75\t
      \   pid1=$!\n76\t    cd {{ client }} && npm run dev &\n77\t    pid2=$!\n78\t
      \   trap 'kill $pid1 $pid2 2>/dev/null; wait $pid1 $pid2 2>/dev/null; exit 0'
      INT TERM\n79\t    sleep 1\n80\t    just open {{ dev_client_port }}\n81\t    wait\n82\t\n83\t#
      Start only the server (dev mode with hot reload)\n84\tdev-server:\n85\t    cd
      {{ server }} && npm run dev\n86\t\n87\t# Start only the client (Vite dev server)\n88\tdev-client:\n89\t
      \   cd {{ client }} && npm run dev\n90\t\n91\t# Build the client for production
      - not needed if using docker\n92\tdev-client-build:\n93\t    cd {{ client }}
      && npm run build\n94\t\n95\t# ─── Testing ────────────────────────────────────────────\n96\t\n97\t#
      Run all tests (server + client)\n98\ttest:\n99\t    npm test\n100\t\n101\t#
      Send a test event to the server\n102\ttest-event:\n103\t    @echo '{\"session_id\":\"test-1234\",\"hook_event_name\":\"SessionStart\",\"cwd\":\"/tmp\",\"source\":\"new\"}'
      \\\n104\t      | AGENTS_OBSERVE_PROJECT_NAME=test-project node {{ project_root
      }}/hooks/scripts/observe_cli.mjs\n105\t    @echo \"Event sent\"\n106\t\n107\t#
      ─── Database ────────────────────────────────────────────\n108\t\n109\t# Delete
      the events database\n110\tdb-reset:\n111\t    rm -f {{ project_root }}/data/observe.db
      {{ project_root }}/data/observe.db-wal {{ project_root }}/data/observe.db-shm\n112\t
      \   @echo \"Database reset\"\n113\t\n114\t# ─── Utilities ───────────────────────────────────────────\n115\t\n116\t#
      Generate hooks config for a project's .claude/settings.json\n117\tsetup-hooks
      project_slug:\n118\t    #!/usr/bin/env bash\n119\t    hook_script=\"{{ hook_script
      }}\"\n120\t    sed \\\n121\t      -e \"s|__PROJECT_SLUG__|{{ project_slug }}|g\"
      \\\n122\t      -e \"s|__HOOK_SCRIPT__|${hook_script}|g\" \\\n123\t      \"{{
      project_root }}/settings.template.json\"\n124\t    echo \"\"\n125\t    echo
      \"Copy the above JSON into your project's .claude/settings.json\"\n126\t\n127\t#
      Check server health\n128\thealth:\n129\t    node {{ cli_script }} health\n130\t\n131\t#
